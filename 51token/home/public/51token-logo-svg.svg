<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Deep Space/Tech Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050D1A"/>
      <stop offset="100%" stop-color="#121B2E"/>
    </linearGradient>

    <!-- Accelerator Cyan Glow for "5" -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Token Ring Purple Glow -->
    <linearGradient id="purpleGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B224EF"/>
      <stop offset="100%" stop-color="#7579FF"/>
    </linearGradient>

    <!-- Unclamped Neon Glow Filter for dynamic light effect -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow for depth against background -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>



  <!-- Centered Main Pattern Group 
       Scaled up significantly to reduce negative space. 
       Skewed to represent "Acceleration" and "Efficiency". -->
  <g transform="translate(400, 400) skewX(-14)" filter="url(#dropShadow)">
    
    <!-- Outer Accelerator / Token Ring 
         An open, dynamic orbit framing the numbers, representing the open developer ecosystem -->
    <path d="M 184 -184 A 260 260 0 1 0 251 -67" 
          fill="none" 
          stroke="url(#purpleGlow)" 
          stroke-width="44" 
          stroke-linecap="round" 
          filter="url(#neonGlow)"/>

    <!-- The Number "5"
         Bold, geometric, single continuous flowing line representing logic and stability -->
    <path d="M 20 -140 L -130 -140 L -130 0 L 20 0 L 20 140 L -130 140" 
          fill="none" 
          stroke="url(#cyanGlow)" 
          stroke-width="50" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#neonGlow)"/>

    <!-- The Number "1"
         Sleek and solid white pillar representing the core focus and honesty/transparency -->
    <path d="M 90 -90 L 140 -140 L 140 140" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="50" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
  </g>
</svg>
